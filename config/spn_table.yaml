# Not in the table yet (need a verified source before adding): SCR temperatures,
# NOx sensors, EGR valve position, PTO status, derate status. They are decoded
# only after an entry with a checked position is added here.
#
# Handled in code, not by this table (fixed structure):
#   PGN 65226 DM1 / 65227 DM2  lamps + SPN/FMI/OC list (J1939-73, conversion method 4)
#   PGN 60416 TP.CM / 60160 TP.DT  transport protocol (J1939-21) BAM and RTS/CTS
