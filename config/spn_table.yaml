# J1939 SPN decode table -- EDITABLE DATA, not code.
#
# EVERY entry ships with `verified: false`. Byte/bit positions, scaling and
# ranges below were transcribed from memory of SAE J1939-71 / J1939DA and
# MUST be checked against your licensed copy of J1939DA (or the engine OEM's
# J1939 broadcast list) before the decoded values are trusted. Set
# `verified: true` only after that check, and record the source in `notes`.
#
# Field conventions (J1939-71 style):
#   start_byte  1-based byte index in the PGN payload (byte 1 = first byte)
#   start_bit   1-based bit index inside start_byte (bit 1 = LSB)
#   length_bits field length; multi-byte values are little-endian (Intel)
#   physical = raw * scale + offset, in `unit`
#   valid_min / valid_max: decoded values outside this range -> NULL, counted
#                          as `out_of_range`
#   na_handling:
#     standard  J1939-71 ranges by field length:
#               2 bit: 2=error 3=not available; 4 bit: 14=error 15=n/a;
#               8/16/32 bit: most-significant byte 0xFB-0xFD reserved,
#               0xFE error indicator, 0xFF not available.
#     explicit  use the `na_raw` / `error_raw` lists on the entry instead.
#   Not-available / error / reserved / out-of-range values decode to NULL,
#   never to a reading.
#   aggregate   how samples inside one resample interval are combined
#               (mean | last | max | min)
#   rate_ms     TYPICAL broadcast period (unverified; OEMs differ). Used only
#               to choose how long a value may be held across empty intervals.
#   attribute_to: source (default) -> the value belongs to the sender's SA;
#               destination -> belongs to the DA (e.g. TSC1 is a COMMAND sent
#               *to* the engine by another controller).
#   oem_specific: true -> decoded only where actually broadcast; absence is
#               normal and must never be read as "zero".

meta:
  standard_reference: "SAE J1939-71 / J1939DA (not bundled; verify against your licensed copy)"
  all_entries_verified: false

