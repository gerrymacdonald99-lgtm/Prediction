[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "j1939pf"
version = "0.1.0"
description = "Per-engine J1939 exposure, trend and early-warning analysis (no life-loss formulas)."
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "PyYAML>=6.0"]

[project.scripts]
j1939pf = "j1939pf.cli:main"

[project.optional-dependencies]
survival = ["lifelines>=0.27"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
